# Nimbus fork CI.
#
# The upstream generated workflows (ci, node_compat_test,
# ecosystem_compat_test, publish/release) assume denoland infrastructure —
# larger runners, release secrets, and upload buckets — and parts of them
# cannot pass on this fork. This workflow is the fork's required signal:
# it checks the whole workspace (including the CLI, so RuntimeOptions
# drift like E0063 is caught) and runs the focused tests for the crates
# Nimbus consumes and patches.
#
# Linux-only on purpose: macOS/Windows GitHub-hosted runners flake on the
# large nimbus/rusty_v8 git+submodule fetch, and Nimbus consumes the fork
# from Linux and macOS hosts through published tags whose proof gates live
# in nimbus/nimbus CI.

name: nimbus_ci

on:
  push:
    branches:
      - 'nimbus/**'
    tags:
      - 'v*-nimbus.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: nimbus-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check-and-test:
    name: check and test (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          submodules: false

      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621

      - name: Install Deno (used by deno_core stub-consistency tests)
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Cache cargo registry and git sources
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: nimbus-ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: nimbus-ci-cargo-

      - name: Check workspace (includes CLI and runtime workers)
        run: cargo check --locked --workspace

      - name: Test deno_core
        run: cargo test --locked -p deno_core --lib

      - name: Test deno_node
        run: cargo test --locked -p deno_node --lib

      - name: Test deno_crypto
        run: cargo test --locked -p deno_crypto --lib

      - name: Format (nimbus-patched crates)
        run: cargo fmt -p deno_core -p deno_runtime -- --check
